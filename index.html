    <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap');

  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

  <body>
    <div id="app"></div>
    <script>
const STORAGE_KEY = 'stocklog_transactions_v2';
const localNow = new Date();
const today = `${localNow.getFullYear()}-${String(localNow.getMonth() + 1).padStart(2, '0')}-${String(localNow.getDate()).padStart(2, '0')}`;
const seedTransactions = [];

const state = {
  transactions: loadTransactions(),
  query: '',
  side: 'all',
  ticker: 'all',
  date: 'all',
  formSide: 'buy'
};

function loadTransactions() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const valid = Array.isArray(saved) ? saved.filter((trade) => trade && typeof trade.ticker === 'string' && (trade.side === 'buy' || trade.side === 'sell') && Number.isFinite(Number(trade.qty)) && Number(trade.qty) > 0 && Number.isFinite(Number(trade.price)) && Number(trade.price) > 0 && typeof trade.date === 'string') : [];
    return valid.length ? valid : seedTransactions;
  } catch {
    return seedTransactions;
  }
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.transactions));
}

function formatCurrency(value, compact = false) {
  const number = Number(value) || 0;
  return new Intl.NumberFormat('zh-TW', {
    style: 'currency', currency: 'TWD', minimumFractionDigits: 0, maximumFractionDigits: 2,
    notation: compact && Math.abs(number) > 100000 ? 'compact' : 'standard'
  }).format(number);
}

function formatNumber(value, digits = 0) {
  return new Intl.NumberFormat('zh-TW', { maximumFractionDigits: digits, minimumFractionDigits: digits }).format(value || 0);
}

function formatPercent(value) {
  return `${value >= 0 ? '+' : ''}${Number(value || 0).toFixed(2)}%`;
}

function formatDate(value) {
  if (!value) return '—';
  const [year, month, day] = value.split('-');
  return `${year}.${month}.${day}`;
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[char]));
}

function getAnalytics() {
  const byTicker = new Map();
  const realizedByTicker = new Map();
  const ordered = [...state.transactions].sort((a, b) => a.date.localeCompare(b.date));

  ordered.forEach((trade) => {
    const ticker = trade.ticker.toUpperCase();
    const position = byTicker.get(ticker) || { ticker, qty: 0, cost: 0, lastPrice: trade.price, lastDate: trade.date };
    const realized = realizedByTicker.get(ticker) || 0;
    if (trade.side === 'buy') {
      position.qty += trade.qty;
      position.cost += trade.qty * trade.price + trade.fee;
    } else {
      const averageCost = position.qty > 0 ? position.cost / position.qty : 0;
      position.qty = Math.max(0, position.qty - trade.qty);
      position.cost = Math.max(0, position.cost - averageCost * trade.qty);
      realizedByTicker.set(ticker, realized + (trade.price - averageCost) * trade.qty - trade.fee);
    }
    position.lastPrice = trade.price;
    position.lastDate = trade.date;
    byTicker.set(ticker, position);
  });

  const positions = [...byTicker.values()].filter((position) => position.qty > 0.000001).map((position) => {
    const marketValue = position.qty * position.lastPrice;
    const unrealized = marketValue - position.cost;
    const realized = realizedByTicker.get(position.ticker) || 0;
    return { ...position, averageCost: position.cost / position.qty, marketValue, unrealized, realized, pnl: unrealized + realized };
  }).sort((a, b) => b.marketValue - a.marketValue);

  const invested = positions.reduce((sum, position) => sum + position.cost, 0);
  const marketValue = positions.reduce((sum, position) => sum + position.marketValue, 0);
  const realized = [...realizedByTicker.values()].reduce((sum, value) => sum + value, 0);
  const unrealized = positions.reduce((sum, position) => sum + position.unrealized, 0);
  const pnl = realized + unrealized;
  return { positions, invested, marketValue, realized, unrealized, pnl, returnRate: invested ? (pnl / invested) * 100 : 0 };
}

function getTickers() {
  return [...new Set(state.transactions.map((trade) => trade.ticker.toUpperCase()))].sort();
}

function filteredTransactions() {
  const now = new Date(`${today}T23:59:59`);
  const days = state.date === '7d' ? 7 : state.date === '30d' ? 30 : null;
  return [...state.transactions].sort((a, b) => b.date.localeCompare(a.date)).filter((trade) => {
    const query = state.query.trim().toLowerCase();
    const matchesQuery = !query || trade.ticker.toLowerCase().includes(query) || (trade.note || '').toLowerCase().includes(query);
    const matchesSide = state.side === 'all' || trade.side === state.side;
    const matchesTicker = state.ticker === 'all' || trade.ticker === state.ticker;
    const difference = now - new Date(`${trade.date}T23:59:59`);
    const matchesDate = !days || (difference >= 0 && difference <= days * 86400000);
    return matchesQuery && matchesSide && matchesTicker && matchesDate;
  });
}

function renderShell() {
  document.querySelector('#app').innerHTML = `
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">+<i>/</i></span><div><span class="brand-word">台股筆記</span><span class="brand-sub">TW STOCK / JOURNAL</span></div></div>
        <div class="workspace"><span class="eyebrow">MY WORKSPACE</span><strong>台股投資帳本</strong><span><i class="storage-dot"></i>本機儲存 · 已同步</span></div>
        <nav class="nav" aria-label="主要導覽">
          <button class="nav-link active" data-target="overview"><span class="nav-icon">⌂</span>總覽儀表板</button>
          <button class="nav-link" data-target="trades"><span class="nav-icon">↗</span>交易流水</button>
          <button class="nav-link" data-target="positions"><span class="nav-icon">▦</span>目前持倉</button>
        </nav>
        <div class="sidebar-bottom"><span class="eyebrow"><i class="storage-dot"></i>LOCAL MODE</span><p>資料只保存在這個瀏覽器。<br>適合個人、沉著地記錄。</p></div>
      </aside>
      <main class="main-panel" id="overview">
        <header class="topbar"><div class="breadcrumb"><span>WORKSPACE</span>　/　OVERVIEW</div><div class="top-actions"><span class="sync-status"><b>●</b> LOCAL STORAGE READY</span><button class="ghost-button" id="exportTop">匯出 CSV　↗</button></div></header>
        <section class="hero"><div><span class="eyebrow">INVESTMENT JOURNAL / 01</span><h1>讓每一筆決策，<em>有跡可循。</em></h1><p class="hero-copy">不用猜今天做了什麼。把成本、持倉與交易脈絡放在同一個安靜的工作區，讓數字替你保留判斷。</p></div><div class="hero-callout"><span>THIS MONTH / ${new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric' }).format(localNow).toUpperCase()}</span><strong>記錄，先於判斷。</strong></div></section>
        <section class="stat-grid" id="stats"></section>
        <section class="content-grid">
          <div class="panel" id="positions"><div class="panel-header"><div><h2 class="panel-title">目前持倉</h2><div class="panel-kicker">依股票代號彙整 · 估算總損益</div></div><span class="count-badge" id="positionCount">0 POSITIONS</span></div><div class="positions-wrap"><table><thead><tr><th>股票</th><th>持有股數</th><th>平均成本</th><th>最新價格</th><th>市值</th><th>損益</th></tr></thead><tbody id="positionsBody"></tbody></table></div></div>
          <aside class="panel form-card"><div class="panel-header"><div><h2 class="panel-title">新增交易</h2><div class="panel-kicker">LOG A NEW DECISION</div></div><span class="count-badge">+ LOG</span></div><div class="form-body"><p class="form-intro">每一筆買賣，都是投資紀律的一部分。留下它。</p><form id="tradeForm" novalidate><div class="field"><label>交易方向</label><div class="side-toggle"><button type="button" class="side-option active buy" data-side="buy">買進 BUY</button><button type="button" class="side-option" data-side="sell">賣出 SELL</button></div></div><div class="field"><label for="ticker">台股代號</label><input id="ticker" name="ticker" required maxlength="6" placeholder="例如 2330" autocomplete="off" inputmode="numeric" /></div><div class="field-row"><div class="field"><label for="qty">股數</label><input id="qty" name="qty" required type="number" min="1" step="1" placeholder="100" /></div><div class="field"><label for="price">成交價格 (TWD)</label><input id="price" name="price" required type="number" min="0.01" step="0.01" placeholder="625" /></div></div><div class="field-row"><div class="field"><label for="tradeDate">交易日期</label><input id="tradeDate" name="date" required type="date" value="${today}" /></div><div class="field"><label for="fee">手續費 (TWD)</label><input id="fee" name="fee" type="number" min="0" step="0.01" value="0" /></div></div><div class="field"><label for="note">備註 <span class="eyebrow">OPTIONAL</span></label><input id="note" name="note" maxlength="80" placeholder="這筆交易的原因…" /></div><div class="form-error" id="formError" aria-live="polite"></div><button type="submit" class="primary-button">記錄這筆交易　↗</button></form><p class="form-footnote">資料會自動保存在目前瀏覽器，不會上傳。</p></div></aside>
        </section>
        <section class="panel activity-card" id="trades"><div class="panel-header activity-header"><div><h2 class="panel-title">最近交易</h2><div class="panel-kicker">完整流水 · 依日期由新到舊</div></div><div class="table-tools"><div class="search-field"><input id="searchInput" type="search" placeholder="搜尋代號或備註…" aria-label="搜尋交易紀錄" /></div><select class="filter-select" id="sideFilter" aria-label="依方向篩選"><option value="all">全部方向</option><option value="buy">買進</option><option value="sell">賣出</option></select><select class="filter-select" id="tickerFilter" aria-label="依股票篩選"><option value="all">全部股票</option></select><select class="filter-select" id="dateFilter" aria-label="依日期篩選"><option value="all">全部日期</option><option value="7d">近 7 天</option><option value="30d">近 30 天</option></select><button type="button" class="clear-filters" id="clearFilters">清除</button></div></div><div class="positions-wrap"><table class="activity-table"><thead><tr><th>方向</th><th>股票</th><th>日期</th><th>股數</th><th>成交價格</th><th>手續費</th><th>備註</th><th></th></tr></thead><tbody id="transactionsBody"></tbody></table></div><div class="table-footer"><span id="tradeCount">0 筆紀錄</span><button id="exportBottom">匯出全部交易 CSV　↗</button></div></section>
        <footer class="site-footer"><span>交易筆記 / PRIVATE BY DEFAULT</span><span>最後更新 <b id="lastUpdated">—</b></span></footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
  `;
}

function renderStats() {
  const analytics = getAnalytics();
  const cards = [
    { label: '目前持倉市值', value: formatCurrency(analytics.marketValue, true), note: `${analytics.positions.length} 檔持倉`, className: 'accent' },
    { label: '投入成本', value: formatCurrency(analytics.invested, true), note: '剩餘持倉成本' },
    { label: '總損益', value: `${analytics.pnl >= 0 ? '+' : ''}${formatCurrency(analytics.pnl, true)}`, note: `報酬率 ${formatPercent(analytics.returnRate)}`, className: analytics.pnl >= 0 ? 'mint' : 'red' },
    { label: '已實現損益', value: `${analytics.realized >= 0 ? '+' : ''}${formatCurrency(analytics.realized, true)}`, note: `未實現 ${analytics.unrealized >= 0 ? '+' : ''}${formatCurrency(analytics.unrealized, true)}`, className: analytics.realized >= 0 ? 'orange' : 'red' }
  ];
  document.querySelector('#stats').innerHTML = cards.map((card) => `<article class="stat-card ${card.className || ''}"><span class="stat-label">${card.label}</span><strong class="stat-value ${card.className || ''}">${card.value}</strong><span class="stat-note">${card.note}</span></article>`).join('');
}

function renderPositions() {
  const positions = getAnalytics().positions;
  document.querySelector('#positionCount').textContent = `${positions.length} POSITION${positions.length === 1 ? '' : 'S'}`;
  document.querySelector('#positionsBody').innerHTML = positions.length ? positions.map((position) => `
    <tr><td><div class="ticker-cell"><span class="ticker-chip">${escapeHtml(position.ticker.slice(0, 2))}</span><span>${escapeHtml(position.ticker)}</span></div></td><td class="num">${formatNumber(position.qty)}</td><td class="num">${formatCurrency(position.averageCost)}</td><td class="num">${formatCurrency(position.lastPrice)}</td><td class="num">${formatCurrency(position.marketValue)}</td><td class="num ${position.pnl >= 0 ? 'positive' : 'negative'}">${position.pnl >= 0 ? '+' : ''}${formatCurrency(position.pnl)}</td></tr>
  `).join('') : '<tr><td colspan="6"><div class="empty-state">還沒有持倉<span>新增一筆買進交易，就會出現在這裡。</span></div></td></tr>';
}

function renderTickerFilter() {
  const select = document.querySelector('#tickerFilter');
  const current = state.ticker;
  select.innerHTML = '<option value="all">全部股票</option>' + getTickers().map((ticker) => `<option value="${escapeHtml(ticker)}">${escapeHtml(ticker)}</option>`).join('');
  state.ticker = getTickers().includes(current) ? current : 'all';
  select.value = state.ticker;
}

function renderTransactions() {
  const trades = filteredTransactions();
  document.querySelector('#tradeCount').textContent = `${trades.length} / ${state.transactions.length} 筆紀錄`;
  document.querySelector('#transactionsBody').innerHTML = trades.length ? trades.map((trade) => `
    <tr><td><span class="direction ${trade.side}">${trade.side === 'buy' ? '買進' : '賣出'}</span></td><td><strong>${escapeHtml(trade.ticker)}</strong></td><td class="num">${formatDate(trade.date)}</td><td class="num">${formatNumber(trade.qty)}</td><td class="num">${formatCurrency(trade.price)}</td><td class="num">${formatCurrency(trade.fee)}</td><td class="note-cell" title="${escapeHtml(trade.note || '')}">${escapeHtml(trade.note || '—')}</td><td><button class="delete-trade" data-id="${escapeHtml(trade.id)}" aria-label="刪除 ${escapeHtml(trade.ticker)} 交易">×</button></td></tr>
  `).join('') : '<tr><td colspan="8"><div class="empty-state">找不到符合條件的交易<span>試試清除篩選，或先記錄一筆交易。</span></div></td></tr>';
}

function renderAll() {
  renderStats();
  renderPositions();
  renderTickerFilter();
  renderTransactions();
  const latest = [...state.transactions].sort((a, b) => b.date.localeCompare(a.date))[0];
  document.querySelector('#lastUpdated').textContent = latest ? formatDate(latest.date) : '—';
}

function showToast(message, type = 'success') {
  const toast = document.querySelector('#toast');
  toast.textContent = message;
  toast.className = `toast show ${type === 'error' ? 'error' : ''}`;
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => { toast.className = 'toast'; }, 2700);
}

function exportCSV() {
  if (!state.transactions.length) {
    showToast('目前沒有可匯出的交易紀錄。', 'error');
    return;
  }
  const headers = ['日期', '股票代號', '方向', '股數', '成交價格', '手續費', '備註'];
  const rows = [...state.transactions].sort((a, b) => a.date.localeCompare(b.date)).map((trade) => [trade.date, trade.ticker, trade.side === 'buy' ? '買進' : '賣出', trade.qty, trade.price, trade.fee, trade.note || '']);
  const csv = '\ufeff' + [headers, ...rows].map((row) => row.map((cell) => `"${String(cell).replaceAll('"', '""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = `stocklog-${today}.csv`;
  anchor.click();
  URL.revokeObjectURL(url);
  showToast('CSV 已匯出，保留你的交易脈絡。');
}

function getHoldingQtyAtDate(ticker, date) {
  return [...state.transactions].filter((trade) => trade.ticker === ticker && trade.date <= date).sort((a, b) => a.date.localeCompare(b.date)).reduce((quantity, trade) => quantity + (trade.side === 'buy' ? trade.qty : -trade.qty), 0);
}

renderShell();
renderAll();

document.addEventListener('click', (event) => {
  const nav = event.target.closest('.nav-link');
  if (nav) {
    document.querySelectorAll('.nav-link').forEach((item) => item.classList.toggle('active', item === nav));
    document.querySelector(`#${nav.dataset.target}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const sideButton = event.target.closest('.side-option');
  if (sideButton) {
    state.formSide = sideButton.dataset.side;
    document.querySelectorAll('.side-option').forEach((item) => item.className = `side-option ${item.dataset.side === state.formSide ? `active ${state.formSide}` : ''}`);
    return;
  }
  const deleteButton = event.target.closest('.delete-trade');
  if (deleteButton) {
    const trade = state.transactions.find((item) => item.id === deleteButton.dataset.id);
    if (trade && window.confirm(`確定刪除 ${trade.ticker} 的這筆${trade.side === 'buy' ? '買進' : '賣出'}紀錄嗎？`)) {
      state.transactions = state.transactions.filter((item) => item.id !== trade.id);
      persist();
      renderAll();
      showToast('交易已刪除，摘要已同步更新。');
    }
  }
  if (event.target.closest('#exportTop, #exportBottom')) exportCSV();
  if (event.target.closest('#clearFilters')) {
    state.query = ''; state.side = 'all'; state.ticker = 'all'; state.date = 'all';
    document.querySelector('#searchInput').value = '';
    document.querySelector('#sideFilter').value = 'all';
    document.querySelector('#dateFilter').value = 'all';
    renderTickerFilter(); renderTransactions();
  }
});

document.addEventListener('input', (event) => {
  if (event.target.id === 'searchInput') {
    state.query = event.target.value;
    renderTransactions();
  }
  if (event.target.id === 'ticker') event.target.value = event.target.value.replace(/[^0-9]/g, '').slice(0, 6);
});

document.addEventListener('change', (event) => {
  if (event.target.id === 'sideFilter') state.side = event.target.value;
  if (event.target.id === 'tickerFilter') state.ticker = event.target.value;
  if (event.target.id === 'dateFilter') state.date = event.target.value;
  if (['sideFilter', 'tickerFilter', 'dateFilter'].includes(event.target.id)) renderTransactions();
});

document.querySelector('#tradeForm').addEventListener('submit', (event) => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const ticker = String(form.get('ticker') || '').trim().toUpperCase();
  const qty = Number(form.get('qty'));
  const price = Number(form.get('price'));
  const fee = Number(form.get('fee') || 0);
  const date = String(form.get('date') || '');
  const note = String(form.get('note') || '').trim();
  const error = document.querySelector('#formError');
  error.textContent = '';

  if (!/^\d{4,6}$/.test(ticker) || !Number.isInteger(qty) || qty <= 0 || !Number.isFinite(price) || price <= 0 || !Number.isFinite(fee) || fee < 0 || !date) {
    error.textContent = '請輸入 4–6 位數字台股代號，並確認股數、價格與日期。';
    return;
  }
  if (date > today) {
    error.textContent = '交易日期不能晚於今天。';
    return;
  }
  if (state.formSide === 'sell' && qty > getHoldingQtyAtDate(ticker, date)) {
    error.textContent = `賣出股數超過該日期持倉（可賣 ${formatNumber(getHoldingQtyAtDate(ticker, date))} 股）。`;
    return;
  }
  const actionLabel = state.formSide === 'buy' ? '買進' : '賣出';
  state.transactions.push({ id: crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`, ticker, side: state.formSide, qty, price, fee, date, note });
  persist();
  event.currentTarget.reset();
  document.querySelector('#tradeDate').value = today;
  document.querySelector('#fee').value = '0';
  document.querySelector('#formError').textContent = '';
  state.formSide = 'buy';
  document.querySelectorAll('.side-option').forEach((item) => item.className = `side-option ${item.dataset.side === 'buy' ? 'active buy' : ''}`);
  renderAll();
  showToast(`${ticker} ${actionLabel}交易已記錄。`);
});

    </script>
  </body>
</html>
